{% extends "base.html" %}

{% block metadata %}
<meta property="og:title" content="Subscription Successful" />
<meta property="og:description" content="Thanks for subscribing to PolicyEdge Premium." />
<link rel="stylesheet" href="{{ url_for('static', filename='css/success.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

{% endblock %}

{% block content %}

<div class="section-block">
    <div class="page-container">
        <div class="success-page">
            <div class="success-card">
                <div class="success-icon">
                    <img src="{{ url_for('static', filename='cityHall.svg') }}" alt="PolicyEdge Logo">
                </div>

                <span class="success-badge">Subscription Active</span>

                <h1>Thanks for your order!</h1>
                <p>
                    Your PolicyEdge Premium subscription is now active.
                    You can manage your billing information or return to the dashboard anytime.
                </p>

                <div class="success-actions">
                    <form action="/create-portal-session" method="POST">
                        <input type="hidden" id="session-id" name="session_id" value="">
                        <button id="checkout-and-portal-button" type="submit">
                            Manage Billing
                        </button>
                    </form>

                    <a href="/index" class="back-link">Back to PolicyEdge</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
