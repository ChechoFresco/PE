{% extends "base.html" %}

{% block metadata %}
<meta property="og:title" content="PolicyEdge Subscription" />
<meta property="og:description" content="Upgrade to PolicyEdge Premium and unlock more agenda tracking features." />
<link rel="stylesheet" href="{{ url_for('static', filename='css/subscription.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://polyfill.io/v3/polyfill.min.js?version=3.52.1&features=fetch"></script>
<script src="https://js.stripe.com/v3/"></script>
{% endblock %}

{% block content %}

<div class="subscription-page">
    <div class="section-block">
        <div class="page-container">
            <div class="subscription-wrap">
                <div class="subscription-card">
                    <div class="subscription-top">
                        <div class="subscription-icon">
                            <img src="{{ url_for('static', filename='cityHall.svg') }}" alt="PolicyEdge Logo">
                        </div>

                        <div class="subscription-copy">
                            <span class="subscription-badge">Premium</span>
                            <h1>PolicyEdge Premium</h1>
                            <h2>$20.00 / month</h2>
                            <p>
                                Get unlimited tracking, saved issues, and premium agenda monitoring.
                            </p>
                        </div>
                    </div>
                    <form action="/create-checkout-session" method="POST" class="subscription-form">
                        <button id="checkout-and-portal-button" type="submit">
                            Subscribe Now
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
