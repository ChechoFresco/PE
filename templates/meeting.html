{% extends "base.html" %}

{% block content %}

<div class="section-block">
    <div class="page-container">

        {% from 'partials/city_tables.html' import city_table %}

        <div class="row justify-content-center" id="conTable">

            {% for meeting_type, items in grouped.items() %}

                <div class="col-sm-6">

                    {{ city_table(city, {
                        'agendas': items
                    }) }}

                </div>

            {% endfor %}

        </div>

    </div>
</div>

<!-- Bootstrap 5 CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- Bootstrap Table CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/bootstrap-table@1.22.4/dist/bootstrap-table.min.css"
>

<!-- Bootstrap Table JS -->
<script
    src="https://unpkg.com/bootstrap-table@1.22.4/dist/bootstrap-table.min.js">
</script>

{% endblock %}
