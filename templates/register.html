{% extends "base.html" %}
{% block metadata %}
<meta property="og:title" content="Subscribe to PolicyEdge" />
<meta property="og:description" content="PolicyEdge subscription service - Register today to start agenda tracking in your city." />
{% endblock %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}" />
<script src="https://polyfill.io/v3/polyfill.min.js?version=3.52.1&features=fetch"></script>
<script src="https://js.stripe.com/v3/"></script>

{% with messages = get_flashed_messages() %}
{% if messages %}
<script>
    var messages = {{ messages | safe }};
    messages.forEach(msg => alert(msg));
</script>
{% endif %}
{% endwith %}

<div class="register-page">
    <div class="register-card frost">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='cityHall.svg') }}"
                alt="PolicyEdge Logo"
                class="img-fluid"
                style="max-width: 90px; height: auto;">
        </div>

        <h1 class="register-title text-center">Get started with PolicyEdge</h1>
        <p class="register-subtitle text-center">
            Set alerts, track agenda items, and follow the issues that matter to you.
        </p>

        <form action="/createAccount" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="inputUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="inputUsername" name="username" placeholder="John Doe" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="inputEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail" name="email" placeholder="example@email.com" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="inputPassword" class="form-label">Enter Password</label>
                    <input type="password" class="form-control" id="inputPassword" name="password1" placeholder="Password" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="inputPassword2" class="form-label">Repeat Password</label>
                    <input type="password" class="form-control" id="inputPassword2" name="password2" placeholder="Password" required>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
